<!DOCTYPE html>
<html lang="ja">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learny</title>
    <link rel="icon" href="../static/images/lion.jpeg">
    <link rel="stylesheet" href="../css/style1.css">
    <script src="../static/js/script.js" defer></script>
<link rel="stylesheet" href="../css/auth-status.css"></head>
<body>
    <!----- ① ローディング画面 ----->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="lion-avatar-wrapper">
                <img src="../static/images/lion.jpeg" alt="ライオン">
            </div>
            <div class="typing-container">
                <p id="loading-text"></p><span class="cursor">｜</span>
            </div>
        </div>
    </div>

        <div id="home-screen" class="home-screen hidden"></div>

        <!-- 三本線メニューボタンとタイトル -->
        <header class="app-header">
            <button id="hamburger-btn" class="hamburger-btn" aria-label="メニューを開く">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <h1 class="header-title">Learny</h1>
            <div id="auth-status" class="auth-status" data-auth-url="../auth.html"></div> 
        </header>

        <!-- スライドメニュー-->
        <nav id="slide-menu" class="slide-menu">
            <ul class="menu-list">
                <li><a href="index.html">🍳 レシピ一覧</a></li>
                <li><a href="材料4つ以内レシピ.html">材料4つ以内レシピ</a></li>
                <li><a href="vegetable.html">🥬 おいしい野菜の見分け方</a></li>
                <li><a href="diagnosis.html">🔍 料理提案診断</a></li>
                <li><a href="review.html">⭐ レビュー・ポイント</a></li>
            </ul>
        </nav>

      
        <div id="menu-overlay" class="menu-overlay"></div>


    <!-- 料理の画像 -->
    <div class="menu-img">
        <img src="../static/images/アボカド納豆しらす丼.jpg" alt="">
    </div>
 
    
    <!-- 料理名 -->
    <h1 class="menu-title">
        アボカド納豆しらす丼
    </h1>
    
    <!-- カテゴリ・調理時間・材料数 -->
    <div class="recipe-meta">
        <span>ごはん</span>
        <span>約10分</span>
        <span>材料4つ</span>
    </div>
 
    <!-- 材料 -->
    <div class="mat">
        <h2>材料 <small>（1人分）</small></h2>
 
        <div class="ingredient-row">
            <span>・アボカド</span>
            <span>好きなだけ</span>
        </div>
 
        <div class="ingredient-row">
            <span>・納豆</span>
            <span>好きなだけ</span>
        </div>

        <div class="ingredient-row">
            <span>・しらす</span>
            <span>好きなだけ</span>
        </div>

        <div class="ingredient-row">
            <span>・ごはん</span>
            <span>好きなだけ</span>
        </div>
 
    </div>
 
    <!-- 作り方 -->
    <div class="recipe">
        <h2>作り方</h2>
 
        <p class="step">
            <strong>①</strong>
            ごはんの上に、タレを混ぜた納豆、アボカド、しらすをのせる。
        </p>
 
        <p class="step">
            <strong>②</strong>
            お好みで醤油やごま油を少し垂らす。
        </p>
 
    </div>


    <!-- レビュー -->
    <section class="review-section" aria-label="レビュー">
      <h2>みんなのレビュー ⭐</h2>
      <div class="review-summary">
        <div class="review-stars" id="average-stars">☆☆☆☆☆</div>
        <p><strong id="review-average">まだ評価はありません</strong></p>
        <p id="review-count">レビュー 0件</p></div>
      <form id="review-form" class="review-form">
        <h3>レビューを投稿する</h3>
        <label for="review-name">お名前</label>
        <input id="review-name" maxlength="30" required placeholder="ニックネーム">
        <label for="review-rating">星の数</label>
        <select id="review-rating" required><option value="5">★★★★★（5）</option>
            <option value="4">★★★★☆（4）</option>
            <option value="3">★★★☆☆（3）</option>
            <option value="2">★★☆☆☆（2）</option>
            <option value="1">★☆☆☆☆（1）</option>
        </select>
        <label for="review-comment">コメント</label>
        <textarea id="review-comment" maxlength="1000" required placeholder="作ってみた感想を教えてね！"></textarea>
        <button id="review-submit" type="submit">レビューを投稿する</button>
        <p id="review-message" role="status" aria-live="polite"></p>
      </form>
      <div class="review-list">
        <h3>投稿されたレビュー</h3>
        <div id="review-items">
            <p>読み込み中...</p>
        </div>
        </div>
    </section>
 
    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/supabase-client.js"></script><script src="../js/auth-status.js"></script></body>
</html>
