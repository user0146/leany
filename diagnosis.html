<!-- メイン -->
<main class="main">
<section class="intro">
<p class="sub-title">TODAY'S MENU</p>
<h1>今日のごはん診断</h1>
<p>
       今の気分やおなかのすき具合から<br>
       あなたにぴったりの料理を提案します！
</p>
</section>
<!-- 診断フォーム -->
<section class="diagnosis-box">
<h2>4つの質問に答えてね！</h2>
<form id="diagnosisForm">
<!-- 質問1 -->
<div class="question">
<h3>Q1. 今日の優先事項は？</h3>
<label>
<input type="radio" name="priority" value="quick" required>
           時短・楽に作りたい
</label>
<label>
<input type="radio" name="priority" value="healthy">
           優しくヘルシーな料理がいい
</label>
</div>
<!-- 質問2 -->
<div class="question">
<h3>Q2. おなかのすき具合は？</h3>
<label>
<input type="radio" name="hunger" value="hungry" required>
           ペコペコ！（しっかりメイン）
</label>
<label>
<input type="radio" name="hunger" value="light">
           そこまで！（スープや軽食）
</label>
</div>
<!-- 質問3 -->
<div class="question">
<h3>Q3. 今日の気力は？</h3>
<label>
<input type="radio" name="energy" value="easy" required>
           ほぼゼロ！（レンジ・ハサミのみ）
</label>
<label>
<input type="radio" name="energy" value="normal">
           ちょっと動ける！（フライパンOK）
</label>
</div>
<!-- 質問4 -->
<div class="question">
<h3>Q4. 舌の気分は？</h3>
<label>
<input type="radio" name="taste" value="rich" required>
           がっつり！（旨辛・中華）
</label>
<label>
<input type="radio" name="taste" value="light">
           さっぱり！（和風・ポン酢）
</label>
</div>
<button type="submit" class="diagnosis-btn">
         診断する！
</button>
</form>
</section>
<!-- 診断結果 -->
<section id="result" class="result hidden">
<p class="sub-title">YOUR RESULT</p>
<h2>あなたにおすすめの料理は...</h2>
<p id="resultType" class="result-type"></p>
<div id="recipeList" class="recipe-list"></div>
<button id="retryBtn" class="retry-btn">
       もう一度診断する
</button>
</section>
