<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learny</title>
    <link rel="icon" href="../../images/キャラデザ（ファビコン用）.png">
    <link rel="stylesheet" href="../../static/css/style.css">
    <script src="../../js/script.js" defer></script>
</head>
<body>
    <!----- ① ローディング画面 ----->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="lion-avatar-wrapper">
                <img src="../../images/lion.jpeg" alt="ライオン">
            </div>
            <div class="typing-container">
                <p id="loading-text"></p><span class="cursor">｜</span>
            </div>
        </div>
    </div>

    <!----- ② ホーム画面 ----->
    <div id="home-screen" class="home-screen hidden">
        
        <!-- 三本線メニューボタンとタイトル -->
        <header class="app-header">
            <button id="hamburger-btn" class="hamburger-btn" aria-label="メニューを開く">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <h1 class="header-title">Learny</h1>
            <div style="width: 24px;"></div> 
        </header>

        <!-- スライドメニュー-->
        <nav id="slide-menu" class="slide-menu">
            <ul class="menu-list">
                <li><a href="index.html">🍳 レシピ一覧</a></li>
                <li><a href="材料4つ以内レシピ.html">材料4つ以内レシピ</a></li>
                <li><a href="vegetable.html">🥬 おいしい野菜の見分け方</a></li>
                <li><a href="diagnosis.html">🔍 料理提案診断</a></li>
                <li><a href="review.html">⭐ レビュー・ポイント</a></li>
            </ul>
        </nav>

      
        <div id="menu-overlay" class="menu-overlay"></div>

        <!-- メインコンテンツ -->
        <main class="main-content">

            <!-- カルーセルの矢印ボタン-->
            <div class="carousel-containar">
                <button class="slider-arrow prev" id="prev-btn" aria-label="前へ">&lt;</button>
                <button class="slider-arrow next" id="next-btn" aria-label="次へ">&gt;</button>
            </div>

            <!-- スライダーラッパー -->
            <div class="slider-wrapper" id="slider-wrapper">

                <!---- トマトパスタ ----->
                <div class="slide-card active">
                    <div class="slide-image">
                        <img src="images/" alt="トマトパスタ"> 
                    </div>
                    <div class="slide-info">
                        <h2>tomato pasta</h2>
                        <p class="slide-sub">10分レシピ(10minレシピ)</p>
                        <p class="slide-desc">トマトパスタやミートパスタ</p>
                        <button class="view-btn">View Recipe</button>
                    </div>
                </div>

                <!----- 卵焼き ------>
                <div class="slide-card">
                    <div class="slide-image">
                        <img src="images/" alt="卵焼き"> 
                    </div>
                    <div class="slide-info">
                        <h2>Tamagoyaki</h2>
                        <p class="slide-sub">5分レシピ</p>
                        <p class="slide-desc">ふんわり美味しい定番の卵焼き</p>
                        <button class="view-btn">View Recipe</button>
                    </div>
                </div>

                <!-------ロールキャベツ------>>
                 <div class="slide-card">
                    <div class="slide-image">
                        <img src="images/" alt="ロールキャベツ"> 
                    </div>
                    <div class="slide-info">
                        <h2>Roll cabbge</h2>
                        <p class="slide-sub">ヘルシーでおいしい</p>
                        <p class="slide-desc">ロールキャベツ</p>
                        <button class="view-btn">View Recipe</button>
                    </div>
                </div>

                <!-- ページネーション-->
                <div class="dots-container" id="dots-container">
                    <span class="dot active" data-index="0"></span>
                    <span class="dot" data-index="1"></span>
                    <span class="dot" data-index="2"></span>
                </div>

            </div>
        </main>
    </div>
</body>
</html>
